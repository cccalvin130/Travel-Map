<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Travel Map</title>

    <link rel="stylesheet"
          href="{% static 'locations/style.css' %}">

    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@6/dist/echarts.min.js"></script>

</head>

<body>

    <header>

        <h1>My Travel Map</h1>

    </header>


    <main>

        <!-- Current location -->

        <button id="location-btn">
            📍 My Current Location
        </button>


        <!-- Add Location -->

        <section class="location-form">

            <input
                id="location-name"
                type="text"
                placeholder="Location Name"
            >

            <input
                id="country"
                type="text"
                placeholder="Country"
            >

            <input
                id="city"
                type="text"
                placeholder="City"
            >

            <input
                id="visit-date"
                type="date"
            >

            <textarea
                id="notes"
                placeholder="Notes"
            ></textarea>

            <button id="save-location-btn">
                Save Location
            </button>

        </section>


        <!-- ECharts Map -->

        <div id="map"></div>

    </main>


    <script src="{% static 'locations/map.js' %}"></script>

</body>

</html>
