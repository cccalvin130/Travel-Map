<!DOCTYPE html>
<html>
<head>
    <title>Email Sent - Travel Map</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .done-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 400px; text-align: center; }
        .icon { font-size: 60px; margin-bottom: 20px; }
        h1 { color: #333; margin-bottom: 15px; font-size: 26px; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; line-height: 1.6; }
        .back-link { display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 10px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="done-box">
        <div class="icon">✅</div>
        <h1>Check Your Email</h1>
        <p>We've emailed you instructions for resetting your password. If you don't see the email, check your spam folder.</p>
        <a href="{% url 'login' %}" class="back-link">Back to Login</a>
    </div>
</body>
</html>
