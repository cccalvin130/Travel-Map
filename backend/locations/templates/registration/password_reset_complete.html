<!DOCTYPE html>
<html>
<head>
    <title>Password Reset Complete - Travel Map</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .complete-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 400px; text-align: center; }
        .icon { font-size: 60px; margin-bottom: 20px; }
        h1 { color: #333; margin-bottom: 15px; font-size: 26px; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; line-height: 1.6; }
        .login-btn { display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 10px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="complete-box">
        <div class="icon">🎉</div>
        <h1>Password Reset!</h1>
        <p>Your password has been successfully changed. You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="login-btn">Go to Login</a>
    </div>
</body>
</html>
