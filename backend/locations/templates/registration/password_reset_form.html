<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - Travel Map</title>
    {% load static %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .reset-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 400px; text-align: center; }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; line-height: 1.5; }
        input { width: 100%; padding: 12px 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; font-size: 15px; outline: none; transition: border 0.3s; }
        input:focus { border-color: #667eea; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); }
        .back-link { display: block; margin-top: 20px; color: #667eea; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-box">
        <h1>Reset Password</h1>
        <p>Enter your email address and we'll send you a link to reset your password.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.email }}
            <button type="submit">Send Reset Link</button>
        </form>

        <a href="{% url 'login' %}" class="back-link">← Back to Login</a>
    </div>
</body>
</html>
