{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>My Profile - Travel Map</title>
    <link rel="stylesheet" href="{% static 'locations/style.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f4f8;
        }
        .profile-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }
        .stat-box {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-number {
            font-size: 42px;
            font-weight: bold;
            color: #88B9E6;
        }
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }
        .back-btn {
            display: block;
            width: 200px;
            margin: 30px auto;
            padding: 12px;
            background: #88B9E6;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
        }
        .user-info {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <h1>👤 My Profile</h1>
        <div class="user-info" id="user-info">
            Loading...
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-number" id="stat-locations">-</div>
                <div class="stat-label">📍 Places Visited</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="stat-countries">-</div>
                <div class="stat-label">🌍 Countries</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="stat-cities">-</div>
                <div class="stat-label">🏙️ Cities</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="stat-photos">-</div>
                <div class="stat-label">📸 Photos</div>
            </div>
        </div>

        <a href="{% url 'main-map' %}" class="back-btn">← Back to Map</a>
    </div>

    <script>
        // Load profile stats from API
        fetch('/api/profile/')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-info').innerHTML =
                    '<strong>' + data.username + '</strong><br>' + data.email;
                document.getElementById('stat-locations').textContent = data.total_locations;
                document.getElementById('stat-countries').textContent = data.total_countries;
                document.getElementById('stat-cities').textContent = data.total_cities;
                document.getElementById('stat-photos').textContent = data.total_photos;
            })
            .catch(error => {
                document.getElementById('user-info').textContent = 'Error loading profile';
                console.error(error);
            });
    </script>
</body>
</html>
